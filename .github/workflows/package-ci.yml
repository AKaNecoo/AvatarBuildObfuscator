name: Package CI
on:
  push:
    branches: [main, beta]
    tags: ['v*']
  pull_request:
    branches: [main, beta]
  workflow_dispatch:
permissions:
  contents: read
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test actual update policy and name generator
        run: dotnet run --project Tests~/UpdatePolicy/UpdatePolicy.Tests.csproj --configuration Release
      - name: Test archive validation and reproducibility
        run: python -m unittest discover -s Tests~ -p 'test_*.py' -v
      - name: Build and read back UPM, ZIP and Unity archives
        run: python Tools/ci_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: AvatarBuildObfuscator-${{ github.sha }}
          path: Artifacts/*
          if-no-files-found: error
          retention-days: 30
  publish-release:
    if: github.event_name == 'push' && github.repository == 'AKaNecoo/AvatarBuildObfuscator' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta')
    needs: validate-build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: AvatarBuildObfuscator-${{ github.sha }}
          path: dist
      - name: Publish verified archives (never overwrite changed product under the same version)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: python3 Tools/publish_release.py --channel "$RELEASE_CHANNEL" --commit "$RELEASE_COMMIT" --artifacts dist
  publish-vpm:
    if: github.event_name == 'push' && github.repository == 'AKaNecoo/AvatarBuildObfuscator' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta')
    needs: publish-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: abo-vpm-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build verified public VPM listing
        env:
          GH_TOKEN: ${{ github.token }}
        run: python Tools/vpm_listing.py --output VpmSite --previous
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: VpmSite
      - name: Publish ALCOM / VCC repository
        id: deployment
        uses: actions/deploy-pages@v4
